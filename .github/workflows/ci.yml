name: CI

on:
    push:
        branches:
            - main
            - production
            - "agent/**"
        tags:
            - "v*"
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: cipher-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: ${{ matrix.os }} / Node 24
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - name: Install locked dependencies
              run: npm ci
            - name: Compile, test, format-check and verify
              run: npm run ci
