name: release-integrity

on:
    push:
        branches:
            - production
        tags:
            - "v*"
    release:
        types:
            - published

permissions:
    contents: read

jobs:
    verify:
        name: Verify production references
        runs-on: ubuntu-latest
        steps:
            - name: Checkout full history
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Fetch production references
              shell: bash
              run: git fetch origin main production --tags --force

            - name: Verify aligned references
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  main_sha="$(git rev-parse refs/remotes/origin/main)"
                  production_sha="$(git rev-parse refs/remotes/origin/production)"
                  test "$main_sha" = "$production_sha"

                  if [[ "$EVENT_NAME" == "release" ]]; then
                    tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
                    test "$main_sha" = "$tag_sha"
                  elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    tag_sha="$(git rev-parse "${GITHUB_REF}^{}")"
                    test "$main_sha" = "$tag_sha"
                  fi

            - name: Verify published release metadata
              if: github.event_name == 'release'
              shell: bash
              env:
                  RELEASE_NAME: ${{ github.event.release.name }}
                  RELEASE_DRAFT: ${{ github.event.release.draft }}
                  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  set -euo pipefail
                  test "$RELEASE_NAME" = "Production 1.0.0"
                  test "$RELEASE_DRAFT" = "false"
                  test "$RELEASE_PRERELEASE" = "false"
